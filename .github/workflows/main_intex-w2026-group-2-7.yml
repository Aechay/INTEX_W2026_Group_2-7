name: Build and deploy ASP.Net Core app to Azure Web App - intex-w2026-group-2-7

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

env:
  PROJECT_PATH: ./backend/INTEX_W2026_Group_2-7/INTEX_W2026_Group_2-7/INTEX_W2026_Group_2-7.csproj
  SOLUTION_PATH: ./backend/INTEX_W2026_Group_2-7/INTEX_W2026_Group_2-7.sln
  MIGRATION_RETRY_COUNT: 5
  MIGRATION_RETRY_DELAY_SECONDS: 30

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"
      - name: Build
        run: dotnet build --configuration Release "${{ env.SOLUTION_PATH }}" --no-restore
      - name: Test
        run: dotnet test --configuration Release "${{ env.SOLUTION_PATH }}" --no-build
      - name: Publish
        run: dotnet publish --configuration Release --output "${{ env.DOTNET_ROOT }}/myapp" "${{ env.PROJECT_PATH }}" --no-build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  migrate:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef
      - name: Create operational migration bundle
        run: dotnet ef migrations bundle --configuration Release --context OperationalDbContext --output efbundle-operational.exe --project "${{ env.PROJECT_PATH }}" --startup-project "${{ env.PROJECT_PATH }}"
      - name: Create identity migration bundle
        run: dotnet ef migrations bundle --configuration Release --context IdentityAppDbContext --output efbundle-identity.exe --project "${{ env.PROJECT_PATH }}" --startup-project "${{ env.PROJECT_PATH }}"
      - name: Run migrations with retry
        shell: pwsh
        run: |
          function Invoke-WithRetry {
            param(
              [scriptblock]$Action,
              [string]$Description,
              [int]$MaxAttempts,
              [int]$DelaySeconds
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                Write-Host "Starting $Description (attempt $attempt of $MaxAttempts)..."
                & $Action

                if ($LASTEXITCODE -eq 0) {
                  Write-Host "$Description succeeded."
                  return
                }

                throw "$Description exited with code $LASTEXITCODE."
              }
              catch {
                if ($attempt -eq $MaxAttempts) {
                  throw
                }

                Write-Warning "$Description failed: $($_.Exception.Message)"
                Write-Host "Retrying in $DelaySeconds seconds..."
                Start-Sleep -Seconds $DelaySeconds
              }
            }
          }

          Invoke-WithRetry `
            -Description "operational migrations" `
            -MaxAttempts ${{ env.MIGRATION_RETRY_COUNT }} `
            -DelaySeconds ${{ env.MIGRATION_RETRY_DELAY_SECONDS }} `
            -Action { .\efbundle-operational.exe --connection "${{ secrets.PROD_DB_MIGRATION_CONNECTION_STRING }}" }

          Invoke-WithRetry `
            -Description "identity migrations" `
            -MaxAttempts ${{ env.MIGRATION_RETRY_COUNT }} `
            -DelaySeconds ${{ env.MIGRATION_RETRY_DELAY_SECONDS }} `
            -Action { .\efbundle-identity.exe --connection "${{ secrets.PROD_IDENTITY_DB_MIGRATION_CONNECTION_STRING }}" }

  deploy:
    runs-on: windows-latest
    needs: migrate
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F87576B863A34943B1F748D65747E82F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_59606C6CC3104F068B1FF04C2CD04059 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68D2392684AB4E16B15324FC4E36BA6A }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'intex-w2026-group-2-7'
          slot-name: 'Production'
          package: .
